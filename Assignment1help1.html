<!-- Programming Language: HTML, CSS, JavaScript -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Student Quiz 1</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }
        h2 {
            text-align: center;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #76a1ff;
            color: rgb(0, 0, 0);
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #028cfd;
        }
        .quiz-question, .result {
            display: none;
        }
        .info-display {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="user-info">
            <h2>User Information</h2>
            <input type="text" id="name" placeholder="Enter your name" required>
            <input type="text" id="roll" placeholder="Enter your roll number" required>
            <input type="text" id="class" placeholder="Enter your class" required>
            <button onclick="startQuiz()">Start Quiz</button>
        </div>

        <div class="quiz-question">
            <div class="info-display">
                <strong>Name:</strong> <span id="displayName"></span><br>
                <strong>Roll No:</strong> <span id="displayRoll"></span><br>
                <strong>Class:</strong> <span id="displayClass"></span>
            </div>
            <h2 id="question"></h2>
            <div id="options"></div>
            <button onclick="nextQuestion()">Next</button>
        </div>

        <div class="result">
            <h2>Quiz Completed!</h2>
            <p id="score"></p>
            <button onclick="location.reload()">Restart Quiz</button>
        </div>
    </div>

    <script>
        const quizData = [
            { question: "What is the capital of India?", options: ["New Delhi", "Mumbai", "Kolkata"], answer: "New Delhi" },
            { question: "2 + 2 equals?", options: ["3", "4", "5", "6"], answer: "4" },
            { question: "Which language is used for web development?", options: ["Python", "Java", "HTML/CSS/JS", "C++"], answer: "HTML/CSS/JS" }
        ];

        let currentQuestion = 0;
        let score = 0;
        let userInfo = {};

        function startQuiz() {
            const name = document.getElementById("name").value;
            const roll = document.getElementById("roll").value;
            const className = document.getElementById("class").value;

            if (!name || !roll || !className) {
                alert("Please fill all fields!");
                return;
            }

            userInfo = { name, roll, className };
            document.getElementById("displayName").textContent = name;
            document.getElementById("displayRoll").textContent = roll;
            document.getElementById("displayClass").textContent = className;
            
            document.querySelector(".user-info").style.display = "none";
            document.querySelector(".quiz-question").style.display = "block";
            showQuestion();
        }

        function showQuestion() {
            let q = quizData[currentQuestion];
            document.getElementById("question").textContent = q.question;
            const optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";
            q.options.forEach(option => {
                let btn = document.createElement("button");
                btn.textContent = option;
                btn.onclick = () => checkAnswer(option);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            if (selected === quizData[currentQuestion].answer) score++;
            nextQuestion();
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < quizData.length) {
                showQuestion();
            } else {
                endQuiz();
            }
        }

        function endQuiz() {
            document.querySelector(".quiz-question").style.display = "none";
            document.querySelector(".result").style.display = "block";
            document.getElementById("score").textContent = `${userInfo.name}, your score is ${score}/${quizData.length}`;
        }
    </script>
</body>
</html>
